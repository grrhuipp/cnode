name: CI

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths: &build-paths
      - '.github/workflows/ci.yml'
      - 'mise.toml'
      - 'vcpkg.json'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'src/**'
      - 'include/**'
      - 'tools/**'
      - 'tests/**'
  pull_request:
    paths: *build-paths

permissions:
  contents: read

env:
  RELEASE_TAG: cnode-latest

jobs:
  build:
    runs-on: ubuntu-26.04
    defaults:
      run:
        shell: bash
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: setup
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils git curl zip unzip tar xz-utils pkg-config jq file \
            autoconf autoconf-archive automake libtool perl nasm openssl

      - name: mise
        uses: jdx/mise-action@v5.2.1
        with:
          cache: true
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}

      - name: restore vcpkg
        id: dependencies
        uses: actions/cache/restore@v6.1.0
        with:
          path: build/cache/vcpkg
          key: vcpkg-musl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'vcpkg.json', 'cmake/ports/**', 'cmake/triplets/**', 'cmake/musl.cmake', 'CMakeLists.txt') }}
          restore-keys: |
            vcpkg-musl-${{ runner.os }}-${{ runner.arch }}-

      - name: restore ccache
        id: compiler
        uses: actions/cache/restore@v6.1.0
        with:
          path: build/cache/ccache
          key: ccache-musl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'cmake/musl.cmake') }}-${{ github.sha }}
          restore-keys: |
            ccache-musl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'cmake/musl.cmake') }}-
            ccache-musl-${{ runner.os }}-${{ runner.arch }}-

      - name: configure
        run: |
          set -euo pipefail
          export BUILD_ID="$(date -u +'%Y%m%dT%H%M%SZ')"
          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"
          mise run test:configure

      - name: save vcpkg
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: build/cache/vcpkg
          key: ${{ steps.dependencies.outputs.cache-primary-key }}

      - name: build
        run: mise exec -- cmake --build build/musl --target cnode_tests

      - name: save ccache
        if: steps.compiler.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: build/cache/ccache
          key: ${{ steps.compiler.outputs.cache-primary-key }}

      - name: verify
        run: |
          set -euo pipefail
          mise exec -- ctest --test-dir build/musl --output-on-failure --no-tests=error --parallel --output-junit "$PWD/build/test-results.xml"
          binary=build/musl/cnode
          file "$binary"
          if readelf -l "$binary" | grep -q INTERP; then
            echo 'musl release must have no dynamic interpreter'
            exit 1
          fi
          if readelf -d "$binary" | grep -q NEEDED; then
            echo 'musl release must have no shared-library dependencies'
            exit 1
          fi
          "$binary" -v

      - name: package
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          binary=build/musl/cnode
          mkdir -p build/release
          cp "$binary" build/release/cnode-linux-amd64-musl
          objcopy --only-keep-debug build/release/cnode-linux-amd64-musl build/release/cnode-linux-amd64-musl.debug
          strip build/release/cnode-linux-amd64-musl
          objcopy --add-gnu-debuglink=build/release/cnode-linux-amd64-musl.debug build/release/cnode-linux-amd64-musl
          cp build/release/cnode-linux-amd64-musl build/release/cnode-linux-amd64
          cp build/release/cnode-linux-amd64-musl.debug build/release/cnode-linux-amd64.debug
          printf 'build_id: %s\ncommit: %s\nvariant: musl+epoll (static)\n' "$BUILD_ID" "$GITHUB_SHA" > build/release/notes.md

      - name: upload
        uses: actions/upload-artifact@v7.0.2
        if: github.event_name == 'push'
        with:
          name: cnode-musl-assets
          path: build/release/*
          if-no-files-found: error
          compression-level: 0

      - name: diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: failed-musl-tests
          retention-days: 3
          path: |
            build/*-results.xml
            build/musl/Testing/Temporary/LastTest.log
            build/musl/*_test/**/*.log
            build/musl/e2e-artifacts/**
            build/musl/vcpkg-manifest-install.log

  release:
    runs-on: ubuntu-26.04
    needs: build
    if: github.event_name == 'push'
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: publish
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name cnode-musl-assets --dir release-assets
          test -s release-assets/cnode-linux-amd64-musl
          test -s release-assets/cnode-linux-amd64

          tag_ref="tags/$RELEASE_TAG"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/$tag_ref" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/$tag_ref" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/$tag_ref" -f sha="$GITHUB_SHA" >/dev/null
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$RELEASE_TAG" \
            --notes-file release-assets/notes.md --latest
          gh release upload "$RELEASE_TAG" release-assets/cnode-linux-* \
            --repo "$GITHUB_REPOSITORY" --clobber
