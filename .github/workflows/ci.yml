name: CI

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - '.github/workflows/ci.yml'
      - '.gitignore'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'README.md'
      - 'scripts/**/*.sh'
      - 'src/**/*.cpp'
      - 'src/**/*.hpp'
      - 'include/**/*.hpp'
      - 'tests/**'
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - '.gitignore'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'README.md'
      - 'scripts/**/*.sh'
      - 'src/**/*.cpp'
      - 'src/**/*.hpp'
      - 'include/**/*.hpp'
      - 'tests/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_TAG: cnode-latest

jobs:
  build-metadata:
    name: Build metadata
    runs-on: ubuntu-24.04
    outputs:
      build_id: ${{ steps.time.outputs.build_id }}
      release_time: ${{ steps.time.outputs.release_time }}
    steps:
      - name: Generate timestamp build id
        id: time
        run: |
          echo "build_id=$(date -u +'%Y%m%dT%H%M%SZ')" >> "$GITHUB_OUTPUT"
          echo "release_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

  build:
    name: Build and test (${{ matrix.libc }})
    runs-on: ubuntu-24.04
    needs: build-metadata
    container:
      image: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - libc: musl
            image: alpine:3.20
            link_flags: -static
            sanitizers: 'OFF'
          - libc: glibc
            image: ubuntu:24.04
            link_flags: ''
            sanitizers: 'ON'
    env:
      BUILD_ID: ${{ needs.build-metadata.outputs.build_id }}
      BUILD_DIR: build-${{ matrix.libc }}-epoll
      ASSET_NAME: cnode-linux-amd64-${{ matrix.libc }}
      CCACHE_DIR: ${{ github.workspace }}/build-${{ matrix.libc }}-epoll/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}

    steps:
      - name: Install build tools
        shell: sh
        run: |
          if [ '${{ matrix.libc }}' = musl ]; then
            apk add --no-cache build-base binutils ccache cmake ninja git curl \
              zip unzip tar zstd pkgconf linux-headers musl-dev perl nasm python3 bash file ca-certificates
          else
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              build-essential binutils ccache cmake ninja-build git curl \
              zip unzip tar zstd pkg-config perl nasm file linux-libc-dev python3 ca-certificates
          fi

      - uses: actions/checkout@v6.0.3

      - name: Restore compiler cache
        uses: actions/cache/restore@v5.0.5
        with:
          path: ${{ env.BUILD_DIR }}/.ccache
          key: ccache-${{ matrix.libc }}-epoll-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-${{ matrix.libc }}-epoll-${{ runner.os }}-

      - name: Configure
        run: |
          mkdir -p "$BUILD_DIR"
          ccache --zero-stats
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCNODE_BUILD_TESTS=ON \
            -DCNODE_TEST_SANITIZERS=${{ matrix.sanitizers }} \
            -DCNODE_RELEASE_DEBUG_SYMBOLS=OFF \
            -DCNODE_RELEASE_FRAME_POINTERS=OFF \
            -DCNODE_MEMORY_STATS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.link_flags }}" \
            -DBUILD_ID="$BUILD_ID" 2>&1 | tee "$BUILD_DIR/configure.log"

      - name: Build all tests
        run: |
          cmake --build "$BUILD_DIR" --target cnode_tests --parallel "$(nproc)" \
            2>&1 | tee "$BUILD_DIR/build.log"
          if grep -Ei '(^|[[:space:]])warning(:|[[:space:]])' "$BUILD_DIR/configure.log" "$BUILD_DIR/build.log"; then
            echo 'Build warnings must be fixed before publishing.'
            exit 1
          fi

      - name: Test
        run: |
          ctest --test-dir "$BUILD_DIR" --no-tests=error --output-on-failure \
            --parallel "$(nproc)" --output-junit "$PWD/$BUILD_DIR/test-results.xml"

      - name: Preserve failed regression diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: failed-${{ matrix.libc }}-regressions
          retention-days: 3
          path: |
            ${{ env.BUILD_DIR }}/cnode
            ${{ env.BUILD_DIR }}/configure.log
            ${{ env.BUILD_DIR }}/build.log
            ${{ env.BUILD_DIR }}/test-results.xml
            ${{ env.BUILD_DIR }}/Testing/Temporary/LastTest.log
            ${{ env.BUILD_DIR }}/*_integration_test/**

      - name: Verify and package
        run: |
          file "$BUILD_DIR/cnode"
          "$BUILD_DIR/cnode" -v
          if [ '${{ matrix.libc }}' = musl ]; then
            if readelf -l "$BUILD_DIR/cnode" | grep 'INTERP'; then
              echo 'The default musl artifact must be static.'
              exit 1
            fi
          else
            ldd "$BUILD_DIR/cnode"
          fi
          mkdir -p release-assets
          objcopy --only-keep-debug "$BUILD_DIR/cnode" "$BUILD_DIR/$ASSET_NAME.debug"
          strip "$BUILD_DIR/cnode"
          objcopy --add-gnu-debuglink="$BUILD_DIR/$ASSET_NAME.debug" "$BUILD_DIR/cnode"
          cp "$BUILD_DIR/cnode" "release-assets/$ASSET_NAME"
          cp "$BUILD_DIR/$ASSET_NAME.debug" "release-assets/$ASSET_NAME.debug"
          if [ '${{ matrix.libc }}' = musl ]; then
            cp "$BUILD_DIR/cnode" release-assets/cnode-linux-amd64
            cp "$BUILD_DIR/$ASSET_NAME.debug" release-assets/cnode-linux-amd64.debug
          fi
          ls -lh release-assets

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cnode-${{ matrix.libc }}-epoll-assets
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0

      - name: Show compiler cache stats
        if: always()
        run: ccache --show-stats

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v5.0.5
        with:
          path: ${{ env.BUILD_DIR }}/.ccache
          key: ccache-${{ matrix.libc }}-epoll-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs: [build-metadata, build]
    if: github.event_name == 'push'
    env:
      BUILD_ID: ${{ needs.build-metadata.outputs.build_id }}
      RELEASE_TIME: ${{ needs.build-metadata.outputs.release_time }}
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --pattern 'cnode-*-assets' --dir artifact-download
          mkdir -p release-assets
          while IFS= read -r -d '' asset; do
            name="$(basename "$asset")"
            test ! -e "release-assets/$name" || { echo "Duplicate release asset: $name"; exit 1; }
            cp -- "$asset" "release-assets/$name"
          done < <(find artifact-download -type f -print0)
          test -s release-assets/cnode-linux-amd64-musl
          test -s release-assets/cnode-linux-amd64-glibc

      - name: Publish release assets
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          branch: ${{ github.ref_name }}
          build_id: $BUILD_ID
          release_time: $RELEASE_TIME
          commit: ${{ github.sha }}
          variants: musl+epoll, glibc+epoll
          EOF

          tag_ref="tags/${{ env.RELEASE_TAG }}"
          if gh api "repos/${{ github.repository }}/git/ref/${tag_ref}" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${{ github.repository }}/git/refs/${tag_ref}" \
              -f sha="${{ github.sha }}" -F force=true >/dev/null
          else
            gh api -X POST "repos/${{ github.repository }}/git/refs" \
              -f ref="refs/${tag_ref}" -f sha="${{ github.sha }}" >/dev/null
          fi
          if gh release view "${{ env.RELEASE_TAG }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release delete "${{ env.RELEASE_TAG }}" --repo "${{ github.repository }}" --yes
          fi
          gh release create "${{ env.RELEASE_TAG }}" --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" --title "${{ env.RELEASE_TAG }}" \
            --notes-file release-notes.md --latest
          gh release upload "${{ env.RELEASE_TAG }}" release-assets/* \
            --repo "${{ github.repository }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
