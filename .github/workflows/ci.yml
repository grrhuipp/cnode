name: CI

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths: &build-paths
      - '.github/workflows/ci.yml'
      - 'mise.toml'
      - 'vcpkg.json'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'README.md'
      - 'scripts/**'
      - 'src/**'
      - 'include/**'
      - 'tools/**'
      - 'tests/**'
  pull_request:
    paths: *build-paths

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RELEASE_TAG: cnode-latest

jobs:
  build:
    name: musl static / unit / E2E
    runs-on: ubuntu-26.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install host utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils git curl zip unzip tar xz-utils pkg-config jq file \
            autoconf autoconf-archive automake libtool perl nasm openssl

      - uses: jdx/mise-action@v5.2.1
        with:
          cache: true
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}

      - name: Restore dependency and compiler caches
        uses: actions/cache@v6.1.0
        with:
          path: |
            build/cache/vcpkg
            build/cache/ccache
          key: musl-${{ runner.arch }}-${{ hashFiles('mise.toml', 'vcpkg.json', 'cmake/ports/**', 'cmake/triplets/**', 'cmake/musl.cmake') }}-${{ github.sha }}
          restore-keys: |
            musl-${{ runner.arch }}-${{ hashFiles('mise.toml', 'vcpkg.json', 'cmake/ports/**', 'cmake/triplets/**', 'cmake/musl.cmake') }}-

      - name: Configure
        run: |
          set -euo pipefail
          export BUILD_ID="$(date -u +'%Y%m%dT%H%M%SZ')"
          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"
          mise run bootstrap
          mise exec -- cmake --preset musl-tests -DBUILD_ID="$BUILD_ID" -DCNODE_ENABLE_LTO=ON

      - name: Build explicit test targets
        run: mise exec -- cmake --build --preset musl-tests

      - name: Unit tests
        run: mise exec -- ctest --preset musl-tests --parallel -L '^unit$' --output-junit "$PWD/build/unit-results.xml"

      - name: E2E tests
        run: mise exec -- ctest --preset musl-tests --parallel -L '^e2e$' --output-junit "$PWD/build/e2e-results.xml"

      - name: Verify and package static ELF
        run: |
          set -euo pipefail
          binary=build/musl/cnode
          file "$binary"
          if readelf -l "$binary" | grep -q INTERP; then
            echo 'musl release must have no dynamic interpreter'
            exit 1
          fi
          if readelf -d "$binary" | grep -q NEEDED; then
            echo 'musl release must have no shared-library dependencies'
            exit 1
          fi
          "$binary" -v
          mkdir -p build/release
          cp "$binary" build/release/cnode-linux-amd64-musl
          objcopy --only-keep-debug build/release/cnode-linux-amd64-musl build/release/cnode-linux-amd64-musl.debug
          strip build/release/cnode-linux-amd64-musl
          objcopy --add-gnu-debuglink=build/release/cnode-linux-amd64-musl.debug build/release/cnode-linux-amd64-musl
          cp build/release/cnode-linux-amd64-musl build/release/cnode-linux-amd64
          cp build/release/cnode-linux-amd64-musl.debug build/release/cnode-linux-amd64.debug
          printf 'build_id: %s\ncommit: %s\nvariant: musl+epoll (static)\n' "$BUILD_ID" "$GITHUB_SHA" > build/release/notes.md

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: cnode-musl-assets
          path: build/release/*
          if-no-files-found: error
          compression-level: 0

      - name: Preserve failed diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: failed-musl-tests
          retention-days: 3
          path: |
            build/*-results.xml
            build/musl/Testing/Temporary/LastTest.log
            build/musl/*_test/**/*.log
            build/musl/e2e-artifacts/**
            build/musl/vcpkg-manifest-install.log

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-26.04
    needs: build
    if: github.event_name == 'push'
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download release artifacts
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name cnode-musl-assets --dir release-assets
          test -s release-assets/cnode-linux-amd64-musl
          test -s release-assets/cnode-linux-amd64

      - name: Publish release assets
        run: |
          set -euo pipefail
          tag_ref="tags/$RELEASE_TAG"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/$tag_ref" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/$tag_ref" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/$tag_ref" -f sha="$GITHUB_SHA" >/dev/null
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$RELEASE_TAG" \
            --notes-file release-assets/notes.md --latest
          gh release upload "$RELEASE_TAG" release-assets/cnode-linux-* \
            --repo "$GITHUB_REPOSITORY" --clobber
