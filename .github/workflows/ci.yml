name: CI

on:
  push:
    branches: [master, main]
    paths:
      - '.github/workflows/ci.yml'
      - '.gitignore'
      - 'CMakeLists.txt'
      - 'README.md'
      - 'scripts/**/*.sh'
      - 'src/**/*.cpp'
      - 'src/**/*.hpp'
      - 'include/**/*.hpp'
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - '.gitignore'
      - 'CMakeLists.txt'
      - 'README.md'
      - 'scripts/**/*.sh'
      - 'src/**/*.cpp'
      - 'src/**/*.hpp'
      - 'include/**/*.hpp'

env:
  RELEASE_TAG: cnode-latest

jobs:
  build-metadata:
    name: Build metadata
    runs-on: ubuntu-24.04
    outputs:
      build_id: ${{ steps.time.outputs.build_id }}
      release_time: ${{ steps.time.outputs.release_time }}

    steps:
      - name: Generate timestamp build id
        id: time
        run: |
          build_id="$(date -u +'%Y%m%dT%H%M%SZ')"
          release_time="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "build_id=${build_id}" >> "$GITHUB_OUTPUT"
          echo "release_time=${release_time}" >> "$GITHUB_OUTPUT"
          echo "BUILD_ID=${build_id}"

  build-musl:
    name: Release (musl ${{ matrix.backend }})
    runs-on: ubuntu-24.04
    needs: build-metadata
    container:
      image: alpine:3.20
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: epoll
            asset_suffix: musl
            default_alias: true
    env:
      BUILD_ID: ${{ needs.build-metadata.outputs.build_id }}
      BUILD_DIR: build-musl-${{ matrix.backend }}
      ASSET_NAME: cnode-linux-amd64-${{ matrix.asset_suffix }}

    steps:
      - name: Install Alpine build tools
        run: |
          apk add --no-cache \
            build-base binutils cmake ninja git curl \
            zip unzip tar pkgconf linux-headers musl-dev \
            perl nasm

      - uses: actions/checkout@v6.0.3

      - name: Restore CMake dependency builds
        id: cache-musl
        uses: actions/cache/restore@v5.0.5
        with:
          path: ${{ env.BUILD_DIR }}/_deps
          key: cmake-deps-musl-${{ matrix.backend }}-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cmake-deps-musl-${{ matrix.backend }}-${{ runner.os }}-

      - name: Configure
        run: |
          cmake -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCNODE_MEMORY_STATS=ON \
            -DCMAKE_EXE_LINKER_FLAGS="-static" \
            -DBUILD_ID=${{ env.BUILD_ID }}

      - name: Build
        run: cmake --build "$BUILD_DIR" --parallel $(nproc)

      - name: Verify & package musl binary
        run: |
          file "$BUILD_DIR/cnode"
          "$BUILD_DIR/cnode" -v
          ldd "$BUILD_DIR/cnode" 2>&1 && exit 1 || true
          mkdir -p release-assets
          objcopy --only-keep-debug "$BUILD_DIR/cnode" "$BUILD_DIR/$ASSET_NAME.debug"
          strip "$BUILD_DIR/cnode"
          objcopy --add-gnu-debuglink="$BUILD_DIR/$ASSET_NAME.debug" "$BUILD_DIR/cnode"
          cp "$BUILD_DIR/cnode" "release-assets/$ASSET_NAME"
          cp "$BUILD_DIR/$ASSET_NAME.debug" "release-assets/$ASSET_NAME.debug"
          if [ "${{ matrix.default_alias }}" = "true" ]; then
            cp "$BUILD_DIR/cnode" release-assets/cnode-linux-amd64
            cp "$BUILD_DIR/$ASSET_NAME.debug" release-assets/cnode-linux-amd64.debug
          fi
          ls -lh release-assets

      - name: Upload musl artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cnode-musl-${{ matrix.backend }}-assets
          path: release-assets/*
          if-no-files-found: error

      - name: Save CMake dependency builds
        if: always() && steps.cache-musl.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5.0.5
        with:
          path: ${{ env.BUILD_DIR }}/_deps
          key: cmake-deps-musl-${{ matrix.backend }}-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

  build-glibc:
    name: Release (glibc ${{ matrix.backend }})
    runs-on: ubuntu-24.04
    needs: build-metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: epoll
            asset_suffix: glibc
    env:
      BUILD_ID: ${{ needs.build-metadata.outputs.build_id }}
      BUILD_DIR: build-glibc-${{ matrix.backend }}
      ASSET_NAME: cnode-linux-amd64-${{ matrix.asset_suffix }}

    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential binutils cmake ninja-build git curl \
            zip unzip tar pkg-config perl nasm file linux-libc-dev

      - uses: actions/checkout@v6.0.3

      - name: Restore CMake dependency builds
        id: cache-glibc
        uses: actions/cache/restore@v5.0.5
        with:
          path: ${{ env.BUILD_DIR }}/_deps
          key: cmake-deps-glibc-${{ matrix.backend }}-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cmake-deps-glibc-${{ matrix.backend }}-${{ runner.os }}-

      - name: Build glibc release variant
        run: |
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCNODE_MEMORY_STATS=ON \
            -DBUILD_ID=${{ env.BUILD_ID }}
          cmake --build "$BUILD_DIR" --parallel $(nproc)
          "$BUILD_DIR/cnode" -v

      - name: Package glibc binary
        run: |
          file "$BUILD_DIR/cnode"
          ldd "$BUILD_DIR/cnode"
          mkdir -p glibc-assets
          objcopy --only-keep-debug "$BUILD_DIR/cnode" "$BUILD_DIR/$ASSET_NAME.debug"
          strip "$BUILD_DIR/cnode"
          objcopy --add-gnu-debuglink="$BUILD_DIR/$ASSET_NAME.debug" "$BUILD_DIR/cnode"
          cp "$BUILD_DIR/cnode" "glibc-assets/$ASSET_NAME"
          cp "$BUILD_DIR/$ASSET_NAME.debug" "glibc-assets/$ASSET_NAME.debug"
          ls -lh glibc-assets

      - name: Upload glibc artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cnode-glibc-${{ matrix.backend }}-assets
          path: glibc-assets/*
          if-no-files-found: error

      - name: Save CMake dependency builds
        if: always() && steps.cache-glibc.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5.0.5
        with:
          path: ${{ env.BUILD_DIR }}/_deps
          key: cmake-deps-glibc-${{ matrix.backend }}-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs: [build-metadata, build-musl, build-glibc]
    if: github.event_name == 'push'
    env:
      BUILD_ID: ${{ needs.build-metadata.outputs.build_id }}
      RELEASE_TIME: ${{ needs.build-metadata.outputs.release_time }}

    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: release-assets
          pattern: cnode-*-assets
          merge-multiple: true

      - name: Publish release assets
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          branch: ${{ github.ref_name }}
          build_id: $BUILD_ID
          release_time: $RELEASE_TIME
          commit: ${{ github.sha }}
          variants: musl+epoll, glibc+epoll
          EOF

          tag_ref="tags/${{ env.RELEASE_TAG }}"
          if gh api "repos/${{ github.repository }}/git/ref/${tag_ref}" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${{ github.repository }}/git/refs/${tag_ref}" \
              -f sha="${{ github.sha }}" \
              -F force=true >/dev/null
          else
            gh api -X POST "repos/${{ github.repository }}/git/refs" \
              -f ref="refs/${tag_ref}" \
              -f sha="${{ github.sha }}" >/dev/null
          fi

          if gh release view "${{ env.RELEASE_TAG }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release delete "${{ env.RELEASE_TAG }}" \
              --repo "${{ github.repository }}" \
              --yes
          fi

          gh release create "${{ env.RELEASE_TAG }}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "${{ env.RELEASE_TAG }}" \
            --notes-file release-notes.md \
            --latest

          gh release upload "${{ env.RELEASE_TAG }}" release-assets/* \
            --repo "${{ github.repository }}" \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
