name: CI

on:
  push:
    branches: [master, main]
    paths:
      - '.github/workflows/ci.yml'
      - '.gitignore'
      - 'CMakeLists.txt'
      - 'README.md'
      - 'scripts/**/*.sh'
      - 'src/**/*.cpp'
      - 'src/**/*.hpp'
      - 'include/**/*.hpp'
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - '.gitignore'
      - 'CMakeLists.txt'
      - 'README.md'
      - 'scripts/**/*.sh'
      - 'src/**/*.cpp'
      - 'src/**/*.hpp'
      - 'include/**/*.hpp'

env:
  BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  RELEASE_TAG: cnode-latest
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-musl:
    name: Release (musl static system allocator)
    runs-on: ubuntu-24.04
    container:
      image: alpine:3.20

    steps:
      - name: Install Alpine build tools
        run: |
          apk add --no-cache \
            build-base binutils cmake ninja git curl \
            zip unzip tar pkgconf linux-headers musl-dev \
            perl nasm

      - uses: actions/checkout@v4

      - name: Restore CMake dependency builds
        id: cache-musl
        uses: actions/cache/restore@v4
        with:
          path: build-musl/_deps
          key: cmake-deps-musl-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cmake-deps-musl-${{ runner.os }}-

      - name: Configure
        run: |
          cmake -B build-musl -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCNODE_MEMORY_STATS=ON \
            -DCMAKE_EXE_LINKER_FLAGS="-static" \
            -DBUILD_ID=${{ env.BUILD_ID }}

      - name: Build
        run: cmake --build build-musl --parallel $(nproc)

      - name: Verify & package musl binary
        run: |
          file build-musl/cnode
          ldd build-musl/cnode 2>&1 && exit 1 || true
          mkdir -p release-assets
          objcopy --only-keep-debug build-musl/cnode build-musl/cnode-linux-amd64-musl.debug
          strip build-musl/cnode
          objcopy --add-gnu-debuglink=build-musl/cnode-linux-amd64-musl.debug build-musl/cnode
          cp build-musl/cnode release-assets/cnode-linux-amd64-musl
          cp build-musl/cnode-linux-amd64-musl.debug release-assets/cnode-linux-amd64-musl.debug
          cp build-musl/cnode release-assets/cnode-linux-amd64
          cp build-musl/cnode-linux-amd64-musl.debug release-assets/cnode-linux-amd64.debug
          ls -lh release-assets

      - name: Upload musl artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cnode-musl-assets
          path: release-assets/*
          if-no-files-found: error

      - name: Save CMake dependency builds
        if: always() && steps.cache-musl.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build-musl/_deps
          key: cmake-deps-musl-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

  build-glibc:
    name: Release (glibc heaptrack system allocator)
    runs-on: ubuntu-24.04

    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential binutils cmake ninja-build git curl \
            zip unzip tar pkg-config perl nasm file

      - uses: actions/checkout@v4

      - name: Restore CMake dependency builds
        id: cache-glibc
        uses: actions/cache/restore@v4
        with:
          path: build-heaptrack/_deps
          key: cmake-deps-glibc-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cmake-deps-glibc-${{ runner.os }}-

      - name: Build glibc heaptrack variant
        run: |
          cmake -S . -B build-heaptrack -G Ninja \
            -DCMAKE_BUILD_TYPE=Profile \
            -DBUILD_SHARED_LIBS=OFF \
            -DCNODE_MEMORY_STATS=ON \
            -DCNODE_HEAPTRACK_BUILD=ON \
            -DBUILD_ID=${{ env.BUILD_ID }}
          cmake --build build-heaptrack --parallel $(nproc)
          build-heaptrack/cnode -v

      - name: Package glibc binary
        run: |
          file build-heaptrack/cnode
          ldd build-heaptrack/cnode
          mkdir -p glibc-assets
          objcopy --only-keep-debug build-heaptrack/cnode build-heaptrack/cnode-linux-amd64-glibc.debug
          strip build-heaptrack/cnode
          objcopy --add-gnu-debuglink=build-heaptrack/cnode-linux-amd64-glibc.debug build-heaptrack/cnode
          cp build-heaptrack/cnode glibc-assets/cnode-linux-amd64-glibc
          cp build-heaptrack/cnode-linux-amd64-glibc.debug glibc-assets/cnode-linux-amd64-glibc.debug
          ls -lh glibc-assets

      - name: Upload glibc artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cnode-glibc-assets
          path: glibc-assets/*
          if-no-files-found: error

      - name: Save CMake dependency builds
        if: always() && steps.cache-glibc.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build-heaptrack/_deps
          key: cmake-deps-glibc-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs: [build-musl, build-glibc]
    if: github.event_name == 'push'

    permissions:
      contents: write

    steps:
      - name: Download musl artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          name: cnode-musl-assets

      - name: Download glibc artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          name: cnode-glibc-assets

      - name: Publish release assets
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          branch: ${{ github.ref_name }}
          build_id: ${{ env.BUILD_ID }}
          commit: ${{ github.sha }}
          variants: musl+system-allocator, glibc+system-allocator
          EOF

          tag_ref="tags/${{ env.RELEASE_TAG }}"
          if gh api "repos/${{ github.repository }}/git/ref/${tag_ref}" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${{ github.repository }}/git/refs/${tag_ref}" \
              -f sha="${{ github.sha }}" \
              -F force=true >/dev/null
          else
            gh api -X POST "repos/${{ github.repository }}/git/refs" \
              -f ref="refs/${tag_ref}" \
              -f sha="${{ github.sha }}" >/dev/null
          fi

          if gh release view "${{ env.RELEASE_TAG }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "${{ env.RELEASE_TAG }}" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "${{ env.RELEASE_TAG }}" \
              --notes-file release-notes.md \
              --latest
          else
            gh release create "${{ env.RELEASE_TAG }}" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "${{ env.RELEASE_TAG }}" \
              --notes-file release-notes.md \
              --latest
          fi

          gh release upload "${{ env.RELEASE_TAG }}" release-assets/* \
            --repo "${{ github.repository }}" \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
