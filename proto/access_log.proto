syntax = "proto3";

package acpp.accesslog.v1;

enum AccessResult {
  ACCESS_RESULT_UNSPECIFIED = 0;
  ACCESS_RESULT_COMPLETED = 1;
  ACCESS_RESULT_REJECTED = 2;
  ACCESS_RESULT_FAILED = 3;
  ACCESS_RESULT_CANCELLED = 4;
}
enum Network {
  NETWORK_UNSPECIFIED = 0;
  NETWORK_TCP = 1;
  NETWORK_UDP = 2;
  NETWORK_MUX = 3;
}

enum CloseSide {
  CLOSE_SIDE_UNSPECIFIED = 0;
  CLOSE_SIDE_CLIENT = 1;
  CLOSE_SIDE_REMOTE = 2;
  CLOSE_SIDE_LOCAL = 3;
}

message SourceDescriptor {
  uint32 source_ref = 1;
  string panel_name = 2;
  string panel_api_host = 3;
  string node_type = 4;
  uint64 node_id = 5;
}

message AccessEvent {
  uint32 source_ref = 1;
  bytes event_id = 2;
  uint64 sequence = 3;
  uint64 conn_id = 4;
  uint32 worker_id = 5;
  sint64 user_id = 6;
  int64 started_at_unix_us = 7;
  int64 ended_at_unix_us = 8;
  uint64 duration_ms = 9;
  string user_email = 10;
  string inbound_tag = 11;
  string outbound_tag = 12;
  string protocol = 13;
  Network network = 14;
  string source_ip = 15;
  uint32 source_port = 16;
  string target_host = 17;
  uint32 target_port = 18;
  string remote_ip = 19;
  string local_ip = 20;
  uint64 uplink_bytes = 21;
  uint64 downlink_bytes = 22;
  AccessResult result = 23;
  int32 error_code = 24;
  CloseSide close_side = 25;
  uint32 dns_state = 26;
  string sniff_protocol = 27;
  string sniff_domain = 28;
  // Final-destination IP used by the most recent direct dial attempt. This is
  // populated even when the connection or transport handshake fails.
  string dial_ip = 29;
  string error_reason = 30;
  bytes raw_packet = 31;
  bool raw_packet_truncated = 32;
  // Listener port the client connected to. Distinct from local_ip, which is the
  // node's own address on the OUTBOUND dial. This is the only port a request
  // that fails before authenticating ever reaches, so without it such an event
  // carries no port at all: target_port describes a destination the request
  // never got to name.
  uint32 inbound_port = 33;
  string inbound_ip = 34;
  string peer_ip = 35;
  uint32 peer_port = 36;
  string client_ip_source = 37;
  bool client_ip_trusted = 38;
  string inbound_transport = 39;
  string inbound_security = 40;
  string failure_stage = 41;
  string failure_detail_code = 42;
  int32 os_error_code = 43;
  uint32 local_port = 44;
  string tls_sni = 45;
  string tls_alpn = 46;
  string tls_version = 47;
  string tls_fingerprint = 48;
  string http_host = 49;
  string transport_route_id = 50;
  string original_target_host = 51;
  uint32 original_target_port = 52;
  string route_target_host = 53;
  uint32 route_target_port = 54;
  string final_target_host = 55;
  uint32 final_target_port = 56;
  string route_rule = 57;
  uint64 dns_latency_ms = 58;
  uint32 dns_answer_count = 59;
  uint32 dial_attempt_count = 60;
  repeated string dial_ips = 61;
  uint64 transport_handshake_ms = 62;
  uint64 auth_ms = 63;
  uint64 dial_ms = 64;
  uint64 first_byte_ms = 65;
  uint64 packet_count_up = 66;
  uint64 packet_count_down = 67;
  uint64 datagram_count = 68;
  uint32 distinct_target_count = 69;
  uint64 parent_conn_id = 70;
  uint64 stream_id = 71;
  uint64 runtime_generation = 72;
  uint64 config_generation = 73;
  uint64 raw_packet_original_len = 74;
  uint64 raw_packet_captured_len = 75;
  string raw_packet_sha256 = 76;
  bool raw_packet_redacted = 77;
  string raw_packet_protocol_guess = 78;
}

message AccessBatch {
  uint32 schema_version = 1;
  bytes batch_id = 2;
  string server_id = 3;
  bytes boot_id = 4;
  uint64 first_sequence = 5;
  uint64 last_sequence = 6;
  repeated SourceDescriptor sources = 7;
  repeated AccessEvent events = 8;
  // Set by the log service from HTTP forwarding headers or the TCP peer.
  string node_ip = 9;
  // Set authoritatively by the log service from the receiving endpoint.
  // 1 = normal access stream, 2 = error/security stream.
  uint32 stream_kind = 10;
  string cnode_version = 11;
  string build_id = 12;
  string git_commit = 13;
}
